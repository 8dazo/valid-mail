name: Format landing polish
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/landing-visual-polish-2026'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: design/landing-visual-polish-2026
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format changed files
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/App.tsx src/Landing.tsx src/landing-polish.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/Landing.tsx frontend/src/landing-polish.css
          if ! git diff --cached --quiet; then
            git commit -m "style: format landing polish"
            git push origin HEAD:design/landing-visual-polish-2026
          fi
