name: Prepare V2 landing formatting
on:
  push:
    branches: [feat/weme-v2-art-directed-landing]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore(ui): autoformat V2')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Format landing changes
        run: |
          npm ci --prefix frontend --no-fund
          cd frontend
          npx prettier --write src/Landing.tsx src/App.tsx src/art-directed-v2.css e2e/landing-redesign.spec.ts
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/Landing.tsx frontend/src/App.tsx frontend/src/art-directed-v2.css frontend/e2e/landing-redesign.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ui): autoformat V2'
            git push origin HEAD:feat/weme-v2-art-directed-landing
          fi
