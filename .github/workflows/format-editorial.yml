name: Format WeMe editorial visuals
on:
  push:
    branches: [feat/weme-editorial-assets]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore(ui): autoformat')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Format source changes
        run: |
          npm ci --prefix frontend --no-fund
          cd frontend
          npx prettier --write src/Landing.tsx src/App.tsx src/PDFStudio.tsx src/main.tsx src/editorial-visuals.css
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/Landing.tsx frontend/src/App.tsx frontend/src/PDFStudio.tsx frontend/src/main.tsx frontend/src/editorial-visuals.css
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ui): autoformat'
            git push origin HEAD:feat/weme-editorial-assets
          fi
