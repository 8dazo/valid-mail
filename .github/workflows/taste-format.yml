name: Format taste revamp sources
on:
  push:
    branches: [feat/taste-skill-ui-revamp]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore(taste): format source')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Format edited frontend files
        run: |
          npm ci --prefix frontend --no-fund
          cd frontend
          npx prettier --write src/App.tsx src/Landing.tsx src/main.tsx src/taste-revamp.css e2e/taste-revamp.spec.ts
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/Landing.tsx frontend/src/main.tsx frontend/src/taste-revamp.css frontend/e2e/taste-revamp.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(taste): format source'
            git push origin HEAD:feat/taste-skill-ui-revamp
          fi
