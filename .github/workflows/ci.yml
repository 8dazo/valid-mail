name: Validate WeMe
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
      - name: Check that the README matches the application
        run: npm run docs:check
      - name: Build the Render application from a clean checkout
        run: bash scripts/render-build.sh
      - run: npm run format:check && npm test && npm audit
        working-directory: frontend
      - run: go test -race -count=1 ./... && go vet ./...
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser tests against the embedded production bundle
        run: |
          ./bin/valid-mail >/tmp/weme.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          cd frontend
          npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
