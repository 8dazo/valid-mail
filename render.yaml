services:
  - type: web
    name: weme
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENABLE_SMTP
        value: "false"
      - key: ENABLE_PROXY_SMTP
        value: "false"
      - key: AUTO_UPDATE_DISPOSABLE
        value: "false"
